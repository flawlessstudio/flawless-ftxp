    promote_to: [client_registry, agentic_capability, lifecycle_occurrence, deep_link_surface]

  - id: ADV6-002
    name: github.dev
    concept_type: browser_sandbox_development_client
    materiality: MATERIAL_CLIENT_VARIANT
    temporal_status: PUBLIC_PREVIEW
    evidence: https://docs.github.com/en/codespaces/the-githubdev-web-based-editor
    facts:
      - runs entirely in the browser sandbox
      - does not clone the repository
      - stores uncommitted work in browser local storage
      - can edit and commit but lacks Codespaces compute and integrated terminal semantics
      - available on GitHub.com but documented as unavailable on GHE.com subdomains
    target_applicability: OPTIONAL_AUTHORING_CLIENT
    promote_to: [client_registry, client_parity, persistence_model, deployment_variation]

  - id: ADV6-003
    name: GitHub Agent Finder
    concept_type: agentic_capability_discovery
    materiality: MATERIAL
    temporal_status: CURRENT
    evidence: https://github.blog/changelog/2026-06-17-agent-finder-for-github-copilot-now-available/
    facts:
      - searches an index of AI resources and returns ranked matches
      - can target GitHub curated or private registries
      - discovery respects managed settings
      - discovery does not imply automatic installation or connection
      - implements the open Agentic Resource Discovery specification
