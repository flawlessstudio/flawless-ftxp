    concept_type: agentic_desktop_client
    materiality: MATERIAL
    temporal_status: GENERALLY_AVAILABLE
    evidence:
      - https://docs.github.com/en/copilot/concepts/agents/github-copilot-app
      - https://github.blog/changelog/2026-06-17-github-copilot-app-generally-available/
    facts:
      - desktop application for agent-driven development on macOS Windows and Linux
      - supports parallel sessions across repositories with branch/worktree isolation
      - integrates issues pull requests diff review terminal browser canvases cloud sessions and automations
