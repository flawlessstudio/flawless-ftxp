    - repositories, issues, pull requests, discussions, projects, actions, packages, pages, codespaces and releases
    - Copilot and current agentic repository surfaces where materially relevant
    - identity, authentication, authorization, roles, permissions, policies and entitlements
    - repository settings, navigation, controls, actions, routes, states and journeys
    - REST, GraphQL, Git transport, GitHub CLI and webhooks
    - notifications, events, audit and observability
    - GitHub Apps, OAuth Apps and external integration boundaries
    - security, supply chain, trust boundaries, credentials and secrets
    - failure, rollback, recovery, maintenance, archival and EOL
    - plan, client, state and temporal variation
  out_by_default:
